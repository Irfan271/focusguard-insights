name: Refresh FocusGuard Dataset

on:
  schedule:
    # Runs every 4 hours in UTC.
    - cron: "0 */4 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh-data:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate updated dataset
        run: python -m src.data_generator

      - name: Clean updated dataset
        run: python -m src.data_cleaning

      - name: Commit updated CSV files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add data/raw/app_usage.csv
          git add data/processed/app_usage_clean.csv

          if git diff --staged --quiet; then
            echo "No dataset changes to commit."
          else
            git commit -m "chore: refresh FocusGuard dataset [skip ci]"
            git push
          fi